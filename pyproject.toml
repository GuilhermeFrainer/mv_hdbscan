[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mv-hdbscan"
version = "0.2.0"
description = "Multi-View HDBSCAN clustering estimator"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "hdbscan>=0.8.40",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
]

[dependency-groups]
dev = [
    "marimo[recommended]>=0.24.0",
    "matplotlib>=3.11.1",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
